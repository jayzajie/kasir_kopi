version: 1.0.{build}
image: Visual Studio 2022

branches:
  only:
    - main

environment:
  PATH: C:\flutter\bin;C:\Program Files (x86)\Inno Setup 6;$(PATH)

install:
  - ps: choco install innosetup --no-progress
  - cmd: |
      if exist C:\flutter (
        cd C:\flutter && git fetch --depth 1 origin stable && git checkout stable && git reset --hard origin/stable && cd %APPVEYOR_BUILD_FOLDER%
      ) else (
        git clone -b stable --depth 1 https://github.com/flutter/flutter.git C:\flutter
      )
  - cmd: flutter config --enable-windows-desktop
  - cmd: flutter doctor -v

build_script:
  - cmd: flutter pub get
  - cmd: flutter test test/pos_controller_test.dart test/receipt_printer_test.dart
  - cmd: flutter build windows --release
  - cmd: ISCC.exe windows_installer.iss

artifacts:
  - path: installer_output\KopiKita_POS_Setup.exe
    name: KopiKita_POS_Setup
